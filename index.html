<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 문자 인코딩 및 뷰포트 설정 (모바일 최적화) -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FridgeChef AI - 냉장고 파먹기 & 레시피 추천</title>
  
  <!-- 반응형 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
  <!-- 프리텐다드 폰트 적용 (가독성 향상) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body>
  <!-- 앱 전체 래퍼 (모바일 화면 비율 중심, 데스크톱 중앙 정렬) -->
  <div class="app-container">
    
    <!-- 헤더 영역: 로고 및 타이틀 -->
    <header class="app-header">
      <div class="logo-group">
        <span class="logo-icon">🍳</span>
        <div>
          <h1 class="logo-title">FridgeChef AI</h1>
          <p class="logo-desc">냉장고 사진 한 장으로 시작하는 맞춤 요리</p>
        </div>
      </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="app-main">
      <!-- 1단계: 냉장고 이미지 업로드 및 식재료 인식 섹션 -->
      <section id="step1-section" class="step-card">
        
        <!-- 단계 표시 헤더 -->
        <div class="step-header">
          <span class="step-badge">1단계</span>
          <h2 class="step-title">냉장고 사진을 올려주세요</h2>
        </div>
        <p class="step-guide">
          냉장고 내부가 잘 보이도록 촬영하거나 사진을 업로드하면 AI가 식재료를 자동으로 찾아냅니다.
        </p>

        <!-- 이미지 업로드 드롭존 (드래그 앤 드롭 및 클릭 지원) -->
        <div id="drop-zone" class="drop-zone" role="button" tabindex="0" aria-label="이미지 업로드 영역">
          <!-- 기본 업로드 안내 UI (이미지 선택 전 노출) -->
          <div id="upload-prompt" class="upload-prompt">
            <div class="upload-icon">📸</div>
            <p class="upload-main-text">여기로 사진을 끌어다 놓으세요</p>
            <p class="upload-sub-text">또는 아래 버튼으로 사진을 선택하세요</p>
            
            <div class="upload-button-group">
              <!-- 모바일 카메라 즉시 촬영 버튼 -->
              <button type="button" id="btn-camera" class="btn btn-secondary">
                📷 카메라 촬영
              </button>
              <!-- 갤러리/파일 탐색기 선택 버튼 -->
              <button type="button" id="btn-gallery" class="btn btn-primary">
                🖼️ 사진 선택
              </button>
            </div>
            
            <p class="upload-hint">지원 형식: JPG, PNG, WEBP (최대 20MB)</p>
          </div>

          <!-- 이미지 미리보기 UI (이미지 선택 후 노출) -->
          <div id="preview-container" class="preview-container hidden">
            <div class="image-wrapper">
              <img id="preview-image" src="" alt="선택된 냉장고 사진 미리보기">
            </div>
            
            <!-- 파일 정보 표시 (파일명, 크기) -->
            <div class="file-meta">
              <span id="file-name" class="file-name">-</span>
              <span id="file-size" class="file-size">-</span>
            </div>

            <!-- 사진 재선택 버튼 -->
            <div class="preview-actions">
              <button type="button" id="btn-reselect" class="btn btn-outline">
                🔄 다른 사진 선택
              </button>
            </div>
          </div>
        </div>

        <!-- 숨겨진 파일 입력 필드 (보이지 않지만 스크립트로 트리거됨) -->
        <!-- 1) 모바일 환경에서 환경 카메라를 직접 호출하는 input -->
        <input type="file" id="input-camera" accept="image/*" capture="environment" class="hidden-input" aria-hidden="true">
        <!-- 2) 일반 파일 탐색기 및 갤러리를 호출하는 input -->
        <input type="file" id="input-file" accept="image/*" class="hidden-input" aria-hidden="true">

      </section>
    </main>

    <!-- 하단 푸터 영역 -->
    <footer class="app-footer">
      <p>Powered by OpenRouter & <code>google/gemma-4-26b-a4b-it:free</code></p>
    </footer>

  </div>

  <!-- 메인 스크립트 연결 -->
  <script src="script.js"></script>
</body>
</html>
